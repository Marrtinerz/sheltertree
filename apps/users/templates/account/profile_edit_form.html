<!-- templates/account/profile_edit_form.html -->
{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Edit Profile" %} | ShelterTree{% endblock %}

{% block content %}
<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title">{% trans "Edit Your Profile" %}</h2>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="mt-4 d-flex justify-content-end">
                            <a href="{% url 'account_profile' %}" class="btn btn-secondary me-2">{% trans "Cancel" %}</a>
                            <button type="submit" class="btn btn-primary">{% trans "Save Changes" %}</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
