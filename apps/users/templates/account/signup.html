{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Create Your Account" %} | ShelterTree{% endblock %}
{% block content %}
<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">{% trans "Sign Up" %}</h2>
                    <form class="signup" method="post" action="{% url 'account_signup' %}">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">{% trans "Create Account" %}</button>
                        </div>
                    </form>
                </div>
            </div>
            <p class="text-center mt-3">
                {% blocktrans %}Already have an account? Then please <a href="{{ login_url }}">sign in</a>.{% endblocktrans %}
            </p>
        </div>
    </div>
</div>
{% endblock %}
