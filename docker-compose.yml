# docker-compose.yml
# This is the BASE configuration, shared by all environments.
# It defines the services and their relationship but leaves out
# development-specific settings like port mapping and volume mounts.

services:
  web:
    build:
      context: .
      # This points to our world-class, multi-stage production Dockerfile.
      dockerfile: Dockerfile
    # The CMD to run the server (Gunicorn) is now inside the Dockerfile.
    # We no longer map ports or mount volumes here; that is a development
    # concern that will be handled in the override file.
    depends_on:
      - db

  db:
    # It's a best practice to pin to a specific major version for consistency.
    image: postgres:17
    volumes:
      # This ensures your local database data persists between runs.
      - postgres_data:/var/lib/postgresql/data/
    # The environment variables will be loaded from the .env.dev file
    # when you run your development environment via the override file.
    env_file:
      - .env.dev

  
  # --- ADD THIS NEW SERVICE ---
  sass:
    # We use a standard Node.js image
    image: node:18
    # We mount our project directory into the container
    working_dir: /app
    volumes:
      - .:/app
    # This is the command that runs. It first installs the dependencies from package.json,
    # and then it runs our "watch:sass" script forever.
    command: >
      sh -c "npm install && npm run watch:sass"

volumes:
  postgres_data: